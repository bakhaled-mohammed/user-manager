spring.application.name=user-manager
server.port=8080

# Connexion MySQL : valeurs par défaut pour le PC (XAMPP, root sans mot de passe).
# Docker, Jenkins et Kubernetes fourniront leurs propres valeurs via les variables d'environnement.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_manager?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Actuator : /actuator/health (avec liveness et readiness pour Kubernetes)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
