server {
    listen 80;

    # L'application React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy : les appels /api vont au conteneur du backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
    }
}